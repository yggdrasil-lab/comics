# Komf (Komga Metadata Fetcher) configuration.
# Loaded into the container as a read-only Docker Swarm config at /config/application.yml.
# Credentials (KOMF_KOMGA_USER and KOMF_KOMGA_PASSWORD) are injected via container environment variables.

komga:
  baseUri: http://komga:25600
  eventListener:
    enabled: true
  metadataUpdate:
    default:
      libraryType: "MANGA"
      updateModes:
        - "API"
      aggregate: true
      mergeTags: true
      mergeGenres: true
      bookCovers: true
      seriesCovers: true
      overrideExistingCovers: true

database:
  file: /config/database.sqlite

metadataProviders:
  defaultProviders:
    mangaUpdates:
      priority: 10
      enabled: true
    aniList:
      priority: 9
      enabled: true
