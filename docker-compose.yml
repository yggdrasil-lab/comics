# Comics — self-hosted manga & comics stack
# Komga (reader) + Suwayomi (downloader). Deployed via Docker Swarm on the Muspelheim worker node.

networks:
  aether-net:
    external: true

services:
  komga:
    image: gotson/komga:latest
    user: "1000:1000"
    environment:
      - TZ=Pacific/Auckland
      - DOMAIN_NAME=${DOMAIN_NAME}
      - KOMGA_OIDC_CLIENT_ID=${KOMGA_OIDC_CLIENT_ID}
      - KOMGA_OIDC_CLIENT_SECRET=${KOMGA_OIDC_CLIENT_SECRET}
    volumes:
      - /opt/comics/komga:/config
      - /mnt/storage/media:/data
      - /mnt/storage/comics/library:/downloads
    configs:
      - source: komga_application_yml
        target: /config/application.yml
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [ "node.hostname == muspelheim" ]
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.komga.rule=Host(`komga.${DOMAIN_NAME}`)"
        - "traefik.http.routers.komga.entrypoints=websecure"
        - "traefik.http.routers.komga.tls=true"
        - "traefik.http.services.komga.loadbalancer.server.port=25600"
        # --- HOMEPAGE LABELS ---
        - "homepage.group=Manga"
        - "homepage.name=Komga"
        - "homepage.icon=komga.png"
        - "homepage.href=https://komga.${DOMAIN_NAME}"
        - "homepage.description=Comics & Manga"
        # --- HOMEPAGE WIDGET LABELS ---
        - "homepage.widget.type=komga"
        - "homepage.widget.url=http://komga:25600"
        - "homepage.widget.key={{HOMEPAGE_VAR_KOMGA_KEY}}"
        - "homepage.widget.version=2"
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: localhost", "http://localhost:25600"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      aether-net:
        aliases:
          - komga

  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:stable
    # Runs as UID 1000 by default (the image's `suwayomi` user) — matches the shared volume ownership.
    environment:
      - TZ=Pacific/Auckland
      - DOWNLOAD_AS_CBZ=true
      - AUTH_MODE=basic_auth
      - AUTH_USERNAME=${SUWAYOMI_AUTH_USERNAME}
      - AUTH_PASSWORD=${SUWAYOMI_AUTH_PASSWORD}
      - FLARESOLVERR_ENABLED=true
      - FLARESOLVERR_URL=http://flaresolverr:8191
    volumes:
      # Data dir first, then the shared downloads subfolder mounted over it
      # (the more-specific bind mount wins) so Suwayomi downloads straight
      # into the shared library that Komga reads.
      - /opt/comics/suwayomi:/home/suwayomi/.local/share/Tachidesk
      - /mnt/storage/comics/library:/home/suwayomi/.local/share/Tachidesk/downloads
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [ "node.hostname == muspelheim" ]
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.suwayomi.rule=Host(`manga.${DOMAIN_NAME}`)"
        - "traefik.http.routers.suwayomi.entrypoints=websecure"
        - "traefik.http.routers.suwayomi.tls=true"
        - "traefik.http.services.suwayomi.loadbalancer.server.port=4567"
        # --- HOMEPAGE LABELS ---
        - "homepage.group=Manga"
        - "homepage.name=Suwayomi"
        - "homepage.icon=suwayomi.png"
        - "homepage.href=https://manga.${DOMAIN_NAME}"
        - "homepage.description=Manga Downloader"
    networks:
      - aether-net

  flaresolverr:
    image: ghcr.io/thephaseless/byparr:latest
    # Byparr - FlareSolverr-compatible Cloudflare solver (same v1 API, port 8191).
    # Internal-only: only Suwayomi talks to it, so no Traefik router/labels.
    environment:
      - TZ=Pacific/Auckland
      - LOG_LEVEL=INFO
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [ "node.hostname == muspelheim" ]
    networks:
      - aether-net

configs:
  komga_application_yml:
    file: ./config/komga/application.yml
